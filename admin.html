<!doctype html>
<html lang="ru">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Админка столовой</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
min-height:100vh;
background:#111;
color:white;
padding:30px;
}


.box{

max-width:1100px;
margin:auto;

background:#1b1b1b;

padding:30px;

border-radius:25px;

box-shadow:0 20px 50px #000;

}


.login{

max-width:420px;

margin:80px auto;

}


h1,h2{

margin-top:0;

}


input,textarea,button{

width:100%;

padding:13px;

margin:8px 0;

border-radius:12px;

border:1px solid #444;

font-size:16px;

}


input,textarea{

background:#242424;

color:white;

}



button{

background:#ff5722;

border:0;

color:white;

cursor:pointer;

font-weight:bold;

}


button:hover{

background:#ff7043;

}


.hidden{

display:none;

}


.msg{

padding:12px;

margin-top:10px;

border-radius:10px;

background:#252525;

}


.error{

background:#5a2020;

}


.ok{

background:#18552b;

}



.card{

background:#242424;

padding:15px;

margin:10px 0;

border-radius:15px;

}



table{

width:100%;

border-collapse:collapse;

}


td,th{

padding:10px;

border-bottom:1px solid #444;

}



.small{

color:#aaa;

font-size:13px;

}

</style>

</head>


<body>



<div id="loginBox" class="box login">


<h1>
🔐 Админ вход
</h1>


<input id="email" placeholder="Email">


<input id="password"
type="password"
placeholder="Пароль">


<button onclick="login()">
Войти
</button>


<div id="loginMsg"></div>


</div>






<div id="adminBox" class="box hidden">


<h1>
🍽 Админ панель
</h1>


<button onclick="logout()">
Выйти
</button>



<h2>
📋 Меню
</h2>


<div id="menu"></div>



<h2>
⭐ Отзывы
</h2>


<button onclick="loadReviews()">
Обновить отзывы
</button>


<div id="reviews"></div>



<div id="debug"></div>


</div>







<script>


const SUPABASE_URL =
"https://lzbhpdievyemsioluvyc.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_twusUPyK52Z6ZWlUj3N0Xg__9qocH_9";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);



function message(text,error=false){

let box=document.createElement("div");

box.className="msg "+(error?"error":"ok");

box.innerText=text;

document.querySelector("#loginMsg").appendChild(box);

}




async function login(){


loginMsg.innerHTML="";


message("Проверяем...");


const {data,error}=await supabaseClient.auth.signInWithPassword({

email:
document.querySelector("#email").value.trim(),

password:
document.querySelector("#password").value

});



if(error){

message(
"Ошибка входа: "+error.message,
true
);

return;

}



message("Авторизация успешна");



const uid=data.user.id;



console.log("UID",uid);



const {data:admin,error:adminError}=await supabaseClient

.from("admin_users")

.select("*")

.eq("user_id",uid);



if(adminError){

message(
"Ошибка admin_users: "+adminError.message,
true
);

return;

}



if(!admin || admin.length===0){

message(
"Этот пользователь не добавлен в admin_users",
true
);

return;

}



openAdmin();


}






function openAdmin(){

loginBox.classList.add("hidden");

adminBox.classList.remove("hidden");


loadMenu();

loadReviews();

}







async function loadMenu(){


const {data,error}=await supabaseClient

.from("menu_items")

.select("*")

.order("id");



if(error){

menu.innerHTML=
error.message;

return;

}



menu.innerHTML=data.map(x=>`

<div class="card">

<b>${x.name}</b>

<br>

Цена:
<input id="price${x.id}" value="${x.price}">


<textarea id="desc${x.id}">
${x.desc||""}
</textarea>


<button onclick="saveItem(${x.id})">
💾 Сохранить
</button>


</div>

`).join("");

}




async function saveItem(id){


let price=document.querySelector("#price"+id).value;

let desc=document.querySelector("#desc"+id).value;



const {error}=await supabaseClient

.from("menu_items")

.update({

price:Number(price),

desc:desc

})

.eq("id",id);



alert(
error?
error.message:
"Сохранено"
);


}








async function loadReviews(){


reviews.innerHTML="Загрузка...";


const {data,error}=await supabaseClient

.from("reviews")

.select("*")

.order("created_at",{ascending:false});



if(error){

reviews.innerHTML=error.message;

return;

}



reviews.innerHTML=(data||[]).map(r=>`

<div class="card">

<b>${r.author||"Гость"}</b>

<br>

⭐ ${r.stars||0}

<p>
${r.text||""}
</p>


<div class="small">
${r.created_at||""}
</div>


<button onclick="deleteReview('${r.id}')">

🗑 Удалить

</button>


</div>

`).join("");

}





async function deleteReview(id){


if(!confirm("Удалить отзыв?"))
return;



const {error}=await supabaseClient

.from("reviews")

.delete()

.eq("id",id);



if(error)

alert(error.message);


else

loadReviews();


}






async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}




</script>


</body>

</html>
