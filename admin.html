<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Столовая Админ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#111;color:white;font-family:Arial;padding:30px}
.box{max-width:900px;margin:auto;background:#222;padding:25px;border-radius:20px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px}
button{background:#ff5722;color:white;border:0;font-weight:bold}
.hidden{display:none}.card{background:#333;padding:15px;margin:10px 0;border-radius:12px}
.bad{background:#702020;padding:10px}.good{background:#176b35;padding:10px}
</style>
</head>
<body>
<div class="box" id="login">
<h1>🔐 Админ вход</h1>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<button onclick="login()">Войти</button>
<div id="status"></div>
</div>

<div class="box hidden" id="panel">
<h1>🍽 Админ панель</h1>
<button onclick="logout()">Выйти</button>
<h2>Отзывы</h2>
<button onclick="reviews()">Обновить</button>
<div id="reviews"></div>
</div>

<script>
const URL="https://lzbhpdievyemsioluvyc.supabase.co";
const KEY="sb_publishable_twusUPyK52Z6ZWlUj3N0Xg__9qocH_9";
const db=supabase.createClient(URL,KEY);

async function login(){
status.innerHTML="Проверка...";
let r=await db.auth.signInWithPassword({
email:email.value.trim(),
password:password.value
});
if(r.error){status.innerHTML='<div class="bad">'+r.error.message+'</div>';return;}

let a=await db.from("admin_users").select("*").eq("user_id",r.data.user.id);
if(a.error){status.innerHTML='<div class="bad">'+a.error.message+'</div>';return;}
if(!a.data.length){status.innerHTML='<div class="bad">Нет доступа</div>';return;}

document.getElementById("login").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");
reviews();
}

async function reviews(){
let r=await db.from("reviews").select("*").order("created_at",{ascending:false});
if(r.error){document.getElementById("reviews").innerHTML=r.error.message;return;}
document.getElementById("reviews").innerHTML=(r.data||[]).map(x=>
'<div class="card"><b>'+ (x.author||"Гость") +'</b><p>'+ (x.text||"")+
'</p><button onclick="delReview(\''+x.id+'\')">Удалить</button></div>'
).join("");
}

async function delReview(id){
await db.from("reviews").delete().eq("id",id);
reviews();
}

async function logout(){
await db.auth.signOut();
location.reload();
}
</script>
</body>
</html>
