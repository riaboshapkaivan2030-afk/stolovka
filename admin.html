<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Админка столовой</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
min-height:100vh;

background:
linear-gradient(135deg,#151515,#292929);

color:white;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

}


.container{

width:100%;
max-width:900px;

background:#1c1c1c;

border-radius:25px;

padding:30px;

box-shadow:0 20px 60px #000;

}



input,textarea,button{

width:100%;

padding:14px;

margin:8px 0;

border-radius:12px;

font-size:16px;

}



input,textarea{

background:#292929;

border:1px solid #555;

color:white;

}



button{

background:#ff5722;

border:0;

color:white;

font-weight:bold;

cursor:pointer;

}


button:hover{

background:#ff7043;

}



.hidden{

display:none;

}



.message{

padding:12px;

border-radius:10px;

margin-top:10px;

background:#222;

}



.good{

background:#155b2b;

}



.bad{

background:#6b2020;

}



.card{

background:#292929;

padding:15px;

margin:15px 0;

border-radius:15px;

}



.small{

color:#aaa;

font-size:13px;

}



</style>


</head>



<body>



<div class="container" id="login">


<h1>
🔐 Админ вход
</h1>


<input id="email" placeholder="Email">


<input id="password" 
type="password"
placeholder="Пароль">


<button onclick="login()">
Войти
</button>


<div id="status"></div>


</div>






<div class="container hidden" id="panel">


<h1>
🍽 Админ панель
</h1>



<button onclick="logout()">
Выйти
</button>



<h2>
⭐ Отзывы
</h2>


<button onclick="reviewsLoad()">
Обновить отзывы
</button>


<div id="reviews"></div>



<h2>
🍲 Меню
</h2>


<div id="menu"></div>



</div>








<script>


const SUPABASE_URL =
"https://lzbhpdievyemsioluvyc.supabase.co";



const SUPABASE_KEY =
"sb_publishable_twusUPyK52Z6ZWlUj3N0Xg__9qocH_9";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





function show(text,type=""){

status.innerHTML +=
`
<div class="message ${type}">
${text}
</div>
`;

}







async function login(){


status.innerHTML="";


show("Проверяем вход...");



let {data,error}=

await db.auth.signInWithPassword({

email:
email.value.trim(),

password:
password.value

});



if(error){

show(
"Ошибка входа: "+error.message,
"bad"
);

return;

}



show("Авторизация успешна","good");



let uid=data.user.id;



let {data:admin,error:aerror}=

await db

.from("admin_users")

.select("*")

.eq("user_id",uid);



if(aerror){

show(
"Ошибка admin_users: "+aerror.message,
"bad"
);

return;

}



if(!admin || admin.length===0){

show(
"Нет доступа. UID не найден.",
"bad"
);

return;

}



show(
"Админ подтверждён",
"good"
);



login.classList.add("hidden");

panel.classList.remove("hidden");



reviewsLoad();

menuLoad();


}








async function reviewsLoad(){


reviews.innerHTML="Загрузка...";


let {data,error}=

await db

.from("reviews")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

reviews.innerHTML=error.message;

return;

}



reviews.innerHTML=

(data||[]).map(r=>`


<div class="card">

<b>
${r.author || "Гость"}
</b>


<p>
${r.text || ""}
</p>


<div class="small">

⭐ ${r.stars || 0}

<br>

${r.created_at || ""}

</div>


<button onclick="deleteReview('${r.id}')">

🗑 Удалить

</button>


</div>


`).join("");



}





async function deleteReview(id){


if(!confirm("Удалить отзыв?"))
return;



let {error}=

await db

.from("reviews")

.delete()

.eq("id",id);



if(error)

alert(error.message);

else

reviewsLoad();


}







async function menuLoad(){


menu.innerHTML="Загрузка...";


let {data,error}=

await db

.from("menu_items")

.select("*")

.order("id");



if(error){

menu.innerHTML=error.message;

return;

}



menu.innerHTML=

(data||[]).map(x=>`

<div class="card">


<b>${x.name}</b>


<br>

Цена:
${x.price} ₽


<br>


${x.desc || ""}


</div>


`).join("");



}







async function logout(){

await db.auth.signOut();

location.reload();

}



</script>



</body>

</html>
