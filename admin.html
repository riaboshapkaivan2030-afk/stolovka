<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Админка столовой</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;

background:#101218;

color:white;

}



.hidden{

display:none!important;

}



.login{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}



.box{

background:#1b2230;

padding:30px;

border-radius:25px;

width:380px;

box-shadow:0 0 40px #000;

}



h1,h2{

margin-top:0;

}




input,
textarea,
select{


width:100%;

padding:13px;

margin:8px 0;

border-radius:12px;

border:0;

background:#303849;

color:white;

font-size:16px;

}



textarea{

min-height:120px;

}



button{


padding:13px 20px;

border:0;

border-radius:12px;

background:#ff5722;

color:white;

font-weight:bold;

cursor:pointer;

margin:5px;


}



button:hover{

opacity:.8;

}



#adminPanel{


min-height:100vh;

}



header{


background:#1b2230;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:25px;

font-weight:bold;

}



.layout{


display:flex;

}



.sidebar{


width:240px;

background:#171c27;

min-height:calc(100vh - 80px);

padding:20px;

}



.sidebar button{


width:100%;

background:#252d3c;

text-align:left;

}



.sidebar button:hover{

background:#ff5722;

}



.content{


flex:1;

padding:25px;

}



.card{


background:#1b2230;

padding:25px;

border-radius:20px;

margin-bottom:20px;

}



.grid{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}



.product{


background:#252d3c;

padding:20px;

border-radius:18px;

}



.product img{


width:100%;

height:180px;

object-fit:cover;

border-radius:15px;

}



.red{

background:#c62828;

}



.green{

background:#2e7d32;

}



.message{

padding:12px;

border-radius:10px;

background:#333;

margin-top:10px;

}



.error{

background:#8b2020;

}



.ok{

background:#20733a;

}



</style>


</head>


<body>



<!-- LOGIN -->


<div id="loginPage" class="login">


<div class="box">


<h1>
🔐 Админ вход
</h1>



<input id="email"
placeholder="Email">



<input id="password"
type="password"
placeholder="Пароль">



<button onclick="login()">

Войти

</button>



<div id="loginMessage"></div>


</div>


</div>





<!-- ADMIN -->


<div id="adminPanel" class="hidden">



<header>


<div class="logo">

🍽 Столовая Admin

</div>



<button onclick="logout()">

Выйти

</button>


</header>





<div class="layout">


<div class="sidebar">


<button onclick="openTab('products')">

🍔 Товары

</button>



<button onclick="openTab('reviews')">

⭐ Отзывы

</button>



<button onclick="openTab('settings')">

⚙ Настройки

</button>



</div>






<div class="content">



<section id="products">


<div class="card">


<h1>

🍔 Управление товарами

</h1>



<button onclick="openCreate()">

➕ Добавить товар

</button>


</div>



<div class="card">


<h2>
Список блюд
</h2>



<input id="searchProduct"

placeholder="🔎 Поиск">



<div id="productsList">

</div>


</div>



</section>





<section id="reviews" class="hidden">


<div class="card">

<h1>
⭐ Отзывы
</h1>


<div id="reviewsList">

</div>


</div>


</section>






<section id="settings" class="hidden">


<div class="card">


<h1>
⚙ Настройки
</h1>


<p>

Панель управления столовой

</p>


</div>


</section>




</div>


</div>


</div>




<script>


const SUPABASE_URL =

"https://lzbhpdievyemsioluvyc.supabase.co";



const SUPABASE_KEY =

"ТВОЙ_SB_PUBLISHABLE_KEY";



const db =

supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);




let products=[];



console.log("ADMIN START");
// =================================
// ВХОД
// =================================


async function login(){


let email =
document.getElementById("email").value.trim();


let password =
document.getElementById("password").value;



let msg =
document.getElementById("loginMessage");



msg.innerHTML="Проверка...";





const {data,error}=

await db.auth.signInWithPassword({

email,

password

});





if(error){


msg.innerHTML=

`
<div class="message error">
${error.message}
</div>
`;

return;

}






const user=data.user;





const {data:admin,error:adminError}=

await db

.from("admin_users")

.select("*")

.eq(
"user_id",
user.id
)

.single();





if(adminError || !admin){



await db.auth.signOut();



msg.innerHTML=

`
<div class="message error">

Нет прав администратора

</div>
`;

return;


}






document
.getElementById("loginPage")
.classList.add("hidden");



document
.getElementById("adminPanel")
.classList.remove("hidden");





loadProducts();


}







// =================================
// ВЫХОД
// =================================


async function logout(){


await db.auth.signOut();


location.reload();


}








// =================================
// ВКЛАДКИ
// =================================


function openTab(id){



document

.querySelectorAll(".content section")

.forEach(x=>{

x.classList.add("hidden");

});



document

.getElementById(id)

.classList.remove("hidden");


}









// =================================
// ЗАГРУЗКА ТОВАРОВ
// =================================



async function loadProducts(){



let box=

document.getElementById("productsList");



box.innerHTML="Загрузка...";






const {data,error}=

await db

.from("menu_items")

.select("*")

.order(
"id",
{
ascending:false
}

);






if(error){


box.innerHTML=

`
<div class="message error">

${error.message}

</div>
`;

return;


}






products=data;


renderProducts(data);


}








function renderProducts(list){


let box=

document.getElementById("productsList");



if(!list.length){


box.innerHTML=

"Товаров нет";


return;


}





box.innerHTML=

list.map(p=>`



<div class="product">



${p.image_url ?

`

<img src="${p.image_url}">

`

:

"📷 Нет фото"

}




<h2>

${p.name}

</h2>



<p>

Категория:
${p.category || "-"}

</p>



<p>

💰 ${p.price} ₽

</p>



<p>

${p.description || p.desc || ""}

</p>



<p>

🔥 ${p.calories || 0} ккал

</p>



<p>

🥩 ${p.proteins || 0}

🧈 ${p.fats || 0}

🍞 ${p.carbs || 0}

</p>



<button onclick="editProduct(${p.id})">

✏ Изменить

</button>



<button class="red"

onclick="deleteProduct(${p.id})">

🗑 Удалить

</button>




</div>



`).join("");



}









// =================================
// ДОБАВЛЕНИЕ ТОВАРА
// =================================



function openCreate(){


let name=

prompt(
"Название блюда"
);



if(!name)
return;




let price=

prompt(
"Цена"
);



createProduct({

name,

price:Number(price)

});


}








async function createProduct(item){



const {error}=

await db

.from("menu_items")

.insert(item);





if(error){


alert(error.message);

return;


}




alert(
"Добавлено"
);



loadProducts();


}






// =================================
// УДАЛЕНИЕ
// =================================



async function deleteProduct(id){



if(!confirm(
"Удалить блюдо?"
))

return;





const {error}=

await db

.from("menu_items")

.delete()

.eq(
"id",
id
);





if(error){


alert(error.message);

return;


}




loadProducts();



}







// =================================
// ПОИСК
// =================================


document

.getElementById("searchProduct")

.addEventListener(
"input",
function(){



let text=

this.value.toLowerCase();




let result=

products.filter(p=>


(
p.name+

" "+

p.category+

" "+

(p.description||"")

)

.toLowerCase()

.includes(text)


);





renderProducts(result);



});
    // =================================
// МОДАЛЬНОЕ ОКНО ТОВАРА
// =================================


let editId = null;



function openCreate(){


editId=null;


showEditor();


}






function editProduct(id){


let product =

products.find(
x=>x.id===id
);



if(!product)
return;



editId=id;



showEditor(product);



}







function showEditor(product={}){



let old=document.getElementById("editor");



if(old)
old.remove();





let modal=document.createElement("div");


modal.id="editor";



modal.style=`

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:#000b;

display:flex;

justify-content:center;

align-items:center;

z-index:100;

`;





modal.innerHTML=

`

<div class="card"

style="width:500px;max-height:90vh;overflow:auto;">



<h2>

${editId ? "✏ Изменить блюдо" : "➕ Новое блюдо"}

</h2>




<input id="pName"

placeholder="Название"

value="${product.name || ""}"

>




<select id="pCategory">


<option value="soup">

🍲 Первое

</option>


<option value="main">

🍗 Второе

</option>


<option value="garnish">

🍝 Гарнир

</option>


<option value="drink">

🥤 Напитки

</option>


<option value="dessert">

🍰 Десерт

</option>


<option value="bakery">

🥐 Выпечка

</option>



</select>






<input id="pPrice"

type="number"

placeholder="Цена"

value="${product.price || ""}"

>





<input id="pWeight"

placeholder="Вес"

value="${product.weight || ""}"

>





<textarea id="pDesc"

placeholder="Описание">

${product.description || product.desc || ""}

</textarea>







<h3>

КБЖУ

</h3>



<input id="pCalories"

placeholder="Калории"

value="${product.calories || 0}"

>



<input id="pProtein"

placeholder="Белки"

value="${product.proteins || 0}"

>



<input id="pFat"

placeholder="Жиры"

value="${product.fats || 0}"

>



<input id="pCarbs"

placeholder="Углеводы"

value="${product.carbs || 0}"

>






<h3>

📷 Фото

</h3>



<input

id="pImage"

type="file"

accept="image/*"

>





<img id="preview"

style="width:100%;border-radius:15px;margin-top:10px;"

src="${product.image_url || ""}"

>






<button onclick="saveProduct()">

💾 Сохранить

</button>




<button onclick="closeEditor()"

class="red">

Отмена

</button>




</div>

`;




document.body.appendChild(modal);






document

.getElementById("pImage")

.onchange=function(){



let file=this.files[0];


if(!file)
return;



document

.getElementById("preview")

.src=

URL.createObjectURL(file);



};



}









function closeEditor(){


document

.getElementById("editor")

.remove();



}









// =================================
// СОХРАНЕНИЕ ТОВАРА
// =================================


async function saveProduct(){


let imageUrl=null;



const imageInput =
document.getElementById("pImage");



let file=null;



if(imageInput){

file=imageInput.files[0];

}




if(file){


imageUrl =
await uploadImage(file);


}





if(file){


imageUrl=

await uploadImage(file);


}







let item={



name:

document

.getElementById("pName")

.value,



category:

document

.getElementById("pCategory")

.value,



price:

Number(

document

.getElementById("pPrice")

.value

),



weight:

document

.getElementById("pWeight")

.value,



description:

document

.getElementById("pDesc")

.value,



calories:

Number(

document

.getElementById("pCalories")

.value

||0),



proteins:

Number(

document

.getElementById("pProtein")

.value

||0),



fats:

Number(

document

.getElementById("pFat")

.value

||0),



carbs:

Number(

document

.getElementById("pCarbs")

.value

||0)





};







if(imageUrl)

item.image_url=imageUrl;







let result;






if(editId){


result=

await db

.from("menu_items")

.update(item)

.eq(

"id",

editId

);



}

else{


result=

await db

.from("menu_items")

.insert(item);



}







if(result.error){


alert(

result.error.message

);


return;


}







alert(
"✅ Сохранено"
);



closeEditor();


loadProducts();



}








// =================================
// ЗАГРУЗКА ФОТО
// =================================


async function uploadImage(file){



let filename=

Date.now()

+

"-"

+

file.name;






const {error}=

await db.storage

.from("menu-images")

.upload(

filename,

file

);







if(error){


alert(
"Ошибка фото: "+error.message
);


return null;


}







const url=

db.storage

.from("menu-images")

.getPublicUrl(filename);



return url.data.publicUrl;



}
    // =================================
// ПРОВЕРКА АВТОРИЗАЦИИ
// =================================


async function checkAdminSession(){


const {

data

}=

await db.auth.getSession();




if(!data.session)

return;






const {data:admin}=

await db

.from("admin_users")

.select("*")

.eq(

"user_id",

data.session.user.id

)

.single();






if(admin){



document

.getElementById("loginPage")

.classList.add("hidden");



document

.getElementById("adminPanel")

.classList.remove("hidden");



loadProducts();


}



}







checkAdminSession();









// =================================
// ОТЗЫВЫ В АДМИНКЕ
// =================================



async function loadReviews(){



let box=

document.getElementById("reviewsList");



box.innerHTML="Загрузка...";





const {data,error}=

await db

.from("reviews")

.select("*")

.order(

"created_at",

{

ascending:false

}

);





if(error){


box.innerHTML=

`
<div class="message error">
${error.message}
</div>
`;

return;

}







if(!data.length){


box.innerHTML=

"Отзывов нет";


return;


}







box.innerHTML=data.map(r=>`


<div class="product">


<h3>

⭐ ${r.stars || 5}/5

</h3>



<p>

${r.text}

</p>


<small>

${r.created_at}

</small>




<br>



<button

class="red"

onclick="deleteReview('${r.id}')">

🗑 Удалить

</button>



</div>



`).join("");



}







async function deleteReview(id){



if(
!confirm(
"Удалить отзыв?"
)
)

return;





const {error}=

await db

.from("reviews")

.delete()

.eq(

"id",

id

);





if(error)

alert(error.message);

else

loadReviews();



}








// =================================
// УДАЛЕНИЕ ФОТО
// =================================



async function deleteImage(url){



if(!url)

return;





let file=

url.split("/").pop();





await db.storage

.from("menu-images")

.remove([file]);



}








// =================================
// УДАЛЕНИЕ ТОВАРА С ФОТО
// =================================


// заменяем старую deleteProduct


async function deleteProduct(id){



if(
!confirm(
"Удалить блюдо?"
)

)

return;






let item=

products.find(

x=>x.id===id

);







if(item?.image_url){


await deleteImage(
item.image_url
);


}







const {error}=

await db

.from("menu_items")

.delete()

.eq(

"id",

id

);







if(error){


alert(error.message);

return;


}




loadProducts();



}








// =================================
// АВТООБНОВЛЕНИЕ
// =================================



setInterval(()=>{


if(
!document

.getElementById("adminPanel")

.classList.contains("hidden")

){


loadProducts();


}


},60000);
