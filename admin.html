<script>

const SUPABASE_URL="https://lzbhpdievyemsioluvyc.supabase.co";

const SUPABASE_ANON_KEY="sb_publishable_twusUPyK52Z6ZWlUj3N0Xg__9qocH_9";


const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const $=x=>document.querySelector(x);


function log(text,type="info"){

let box=$("#loginStatus");

box.innerHTML += 
`<div style="
margin:5px;
padding:8px;
border-radius:8px;
background:${type==="error"?"#ffd7d7":"#dff5df"}
">
${text}
</div>`;

}



async function diagnose(){

log("🔍 Проверка Supabase...");


try{

const {data,error}=await supabaseClient.auth.getSession();


if(error){

log("❌ Auth ошибка: "+error.message,"error");
return false;

}


if(!data.session){

log("❌ Сессии нет. Пользователь не вошёл","error");
return false;

}


let uid=data.session.user.id;


log("✅ Сессия найдена");
log("👤 UID: "+uid);



const {data:admin,error:adminError}=await supabaseClient
.from("admin_users")
.select("*")
.eq("user_id",uid);



if(adminError){

log(
"❌ Ошибка admin_users: "+
adminError.message,
"error"
);

return false;

}



if(!admin || admin.length===0){

log(
"❌ UID отсутствует в admin_users",
"error"
);

log(
"Добавь UID: "+uid,
"error"
);

return false;

}


log("✅ Админ найден");


return true;


}catch(e){

log(
"❌ Критическая ошибка: "+e.message,
"error"
);

return false;

}


}




async function login(){


$("#loginStatus").innerHTML="";


log("⏳ Вход...");


let email=$("#email").value.trim();

let password=$("#password").value;



const {data,error}=await supabaseClient.auth.signInWithPassword({

email,
password

});



if(error){

log(
"❌ Ошибка входа: "+error.message,
"error"
);

return;

}



log("✅ Пароль принят");



if(await diagnose()){


log("🎉 Доступ администратора открыт");


openAdmin();


}else{


log(
"🚫 Админка закрыта. Исправь ошибку выше",
"error"
);


}


}




function openAdmin(){

$("#loginBox").classList.add("hidden");

$("#adminBox").classList.remove("hidden");


loadMenu();

loadReviews();


}





async function loadMenu(){


$("#status").textContent="Загрузка меню...";


const {data,error}=await supabaseClient
.from("menu_items")
.select("*")
.order("id");



if(error){

$("#status").textContent=
"❌ MENU ERROR: "+error.message;

return;

}



$("#rows").innerHTML=data.map(x=>`


<tr data-id="${x.id}">

<td>${x.id}</td>

<td>
<input data-name value="${escapeHtml(x.name)}">
</td>

<td>
<input data-price type="number" value="${x.price}">
</td>

<td>${escapeHtml(x.category)}</td>

<td>
<textarea data-desc>${escapeHtml(x.desc)}</textarea>
</td>


</tr>


`).join("");



$("#status").textContent=
"✅ Загружено блюд: "+data.length;


}





async function save(){


let rows=document.querySelectorAll("#rows tr");


let updates=[];



rows.forEach(row=>{


updates.push({

id:Number(row.dataset.id),

name:
row.querySelector("[data-name]").value,

price:
Number(row.querySelector("[data-price]").value),

desc:
row.querySelector("[data-desc]").value,

updated_at:
new Date().toISOString()


});


});



const {error}=await supabaseClient
.from("menu_items")
.upsert(
updates,
{onConflict:"id"}
);



$("#status").textContent=
error?
"❌ SAVE ERROR: "+error.message:
"✅ Сохранено";


}





async function loadReviews(){


const box=$("#reviewsAdmin");


box.innerHTML="Загрузка отзывов...";



const {data,error}=await supabaseClient
.from("reviews")
.select("*")
.order(
"created_at",
{ascending:false}
)
.limit(100);



if(error){

box.innerHTML=
"❌ REVIEWS ERROR: "+
error.message;

return;

}



box.innerHTML=(data||[]).map(r=>`


<div class="reviewAdmin">

<b>${escapeHtml(r.author||"Гость")}</b>

<p>
${escapeHtml(r.text||"")}
</p>


<small>
${r.created_at||""}
</small>


<br>


<button onclick="deleteReview('${r.id}')">
🗑 Удалить
</button>


</div>


`).join("")
||
"Отзывов нет";


}




async function deleteReview(id){


if(!confirm("Удалить отзыв?"))
return;



const {error}=await supabaseClient
.from("reviews")
.delete()
.eq("id",id);



if(error){

alert(
"❌ DELETE ERROR:\n"+
error.message
);


}else{


alert("✅ Отзыв удалён");

loadReviews();


}


}





function escapeHtml(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");


}




$("#loginBtn").onclick=login;

$("#saveBtn").onclick=save;

$("#loadReviewsBtn").onclick=loadReviews;



$("#logoutBtn").onclick=async()=>{

await supabaseClient.auth.signOut();

location.reload();

};



diagnose();



</script>
