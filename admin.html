<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Админка столовой</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
margin:0;
background:#111;
font-family:Arial;
color:white;
padding:30px;
}

.box{
max-width:1100px;
margin:auto;
background:#1c1c1c;
padding:30px;
border-radius:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
background:#303747;
color:white;
border:1px solid #555;
}

button{
padding:14px;
width:100%;
border:0;
border-radius:12px;
background:#ff5722;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.8;
}

.hidden{
display:none;
}

.status{
margin-top:15px;
padding:12px;
border-radius:10px;
background:#333;
}

.ok{
background:#087f23;
}

.err{
background:#8b1e1e;
}


table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #444;
}

</style>

</head>


<body>


<div class="box" id="login">

<h1>🔐 Админ вход</h1>


<input id="email"
value="riaboshapkaiwan2030@gmail.com"
placeholder="Email">


<input id="password"
type="password"
placeholder="Пароль">


<button onclick="login()">
Войти
</button>


<div id="loginStatus" class="status">
Ожидание...
</div>


</div>




<div class="box hidden" id="admin">


<h1>🍽 Панель администратора</h1>


<button onclick="logout()">
Выйти
</button>


<div id="status" class="status"></div>


<h2>Меню</h2>


<table>

<thead>

<tr>
<th>ID</th>
<th>Название</th>
<th>Цена</th>
<th>Описание</th>
</tr>

</thead>


<tbody id="menu"></tbody>


</table>


</div>



<script>


const SUPABASE_URL =
"https://lzbhpdievyemsioluvyc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_twusUPyK52Z6ZWlUj3N0Xg__9qocH_9";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



function msg(id,text,type=""){
let el=document.getElementById(id);
el.innerHTML=text;
el.className="status "+type;
}



async function login(){


msg(
"loginStatus",
"⏳ Авторизация..."
);


let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



let res=
await db.auth.signInWithPassword({
email,
password
});



if(res.error){

msg(
"loginStatus",
"❌ "+res.error.message,
"err"
);

return;

}



msg(
"loginStatus",
"Проверяем права..."
);



let user=
res.data.user;



console.log(
"USER:",
user.id
);



let check=
await db
.from("admin_users")
.select("user_id")
.eq(
"user_id",
user.id
);



console.log(check);



if(check.error){

msg(
"loginStatus",
"❌ Ошибка admin_users: "+check.error.message,
"err"
);

return;

}



if(!check.data.length){

await db.auth.signOut();


msg(
"loginStatus",
"❌ Нет доступа. UID не найден",
"err"
);


return;

}



openAdmin();


}




function openAdmin(){

document
.getElementById("login")
.classList.add("hidden");


document
.getElementById("admin")
.classList.remove("hidden");


loadMenu();

}



async function loadMenu(){


msg(
"status",
"Загрузка меню..."
);



let r=
await db
.from("menu_items")
.select("*")
.order("id");



if(r.error){

msg(
"status",
"❌ "+r.error.message,
"err"
);

return;

}



document
.getElementById("menu")
.innerHTML =
r.data.map(x=>`

<tr>

<td>${x.id}</td>

<td>
<input value="${x.name}">
</td>

<td>
<input value="${x.price}">
</td>


<td>
<textarea>${x.desc||""}</textarea>
</td>


</tr>


`).join("");



msg(
"status",
"✅ Загружено "+r.data.length
,"ok");


}




async function logout(){

await db.auth.signOut();

location.reload();

}



</script>


</body>
</html>а
