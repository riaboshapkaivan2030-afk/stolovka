<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Столовка Admin 2.0</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>


*{
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}


body{

margin:0;

background:#0f1115;

color:white;

}


.layout{

display:flex;

min-height:100vh;

}



/* САЙДБАР */


.sidebar{

width:260px;

background:#171a21;

padding:20px;

position:fixed;

height:100vh;

}


.logo{

font-size:24px;

font-weight:bold;

margin-bottom:30px;

}


.nav button{

background:none;

border:0;

color:white;

padding:14px;

width:100%;

text-align:left;

border-radius:12px;

margin-bottom:8px;

cursor:pointer;

font-size:16px;

}


.nav button:hover,
.nav button.active{

background:#ff5722;

}



/* КОНТЕНТ */


.main{

margin-left:260px;

padding:30px;

width:100%;

}



.card{

background:#181c24;

padding:25px;

border-radius:20px;

margin-bottom:20px;

box-shadow:0 10px 30px #0005;

}



.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

}



.stat{

font-size:30px;

font-weight:bold;

}



input,
textarea,
select{

width:100%;

background:#252b38;

border:1px solid #444;

color:white;

padding:12px;

border-radius:12px;

margin-top:8px;

}



textarea{

min-height:100px;

}



button.action{

background:#ff5722;

border:0;

color:white;

padding:12px;

border-radius:12px;

cursor:pointer;

font-weight:bold;

}



.hidden{

display:none;

}



.product{

background:#222834;

padding:15px;

border-radius:15px;

margin:10px 0;

}



@media(max-width:800px){

.sidebar{

position:relative;

width:100%;

height:auto;

}


.main{

margin-left:0;

}

.layout{

display:block;

}

}


</style>


</head>


<body>


<div class="layout">


<!-- МЕНЮ -->


<aside class="sidebar">


<div class="logo">
🍽 Столовка
</div>


<div class="nav">


<button onclick="openTab('home')">
🏠 Главная
</button>


<button onclick="openTab('products')">
🍔 Товары
</button>


<button onclick="openTab('reviews')">
⭐ Отзывы
</button>


<button onclick="openTab('bans')">
🚫 Баны
</button>


<button onclick="openTab('combos')">
🔥 Комбо
</button>


<button onclick="openTab('settings')">
⚙ Настройки
</button>


</div>


</aside>




<main class="main">



<section id="home">


<div class="card">

<h1>
🏠 Панель
</h1>


<div class="grid">


<div class="card">

Товаров

<div class="stat">
0
</div>

</div>



<div class="card">

Отзывы

<div class="stat">
0
</div>

</div>




<div class="card">

Комбо

<div class="stat">
0
</div>

</div>


</div>


</div>


</section>





<section id="products" class="hidden">


<div class="card">


<h1>
🍔 Товары
</h1>



<h2>
➕ Добавить товар
</h2>


<input id="p_name"
placeholder="Название товара">



<select id="p_category">

<option value="">
Выбери категорию
</option>

<option>
🍲 Первые блюда
</option>

<option>
🍗 Вторые блюда
</option>

<option>
🥗 Салаты
</option>

<option>
🥤 Напитки
</option>

<option>
🍰 Десерты
</option>


</select>



<input id="p_price"
type="number"
placeholder="Цена">



<input id="p_weight"
placeholder="Вес (например 250 г)">



<textarea id="p_desc"
placeholder="Описание"></textarea>



<button class="action"
onclick="addProduct()">

Создать товар

</button>



</div>



<div class="card">


<h2>
Все товары
</h2>


<div id="productList">

Загрузка...

</div>


</div>


</section>




<section id="reviews" class="hidden">

<div class="card">

<h1>
⭐ Отзывы
</h1>


<div id="reviewList"></div>


</div>

</section>



<section id="bans" class="hidden">

<div class="card">

<h1>
🚫 Баны
</h1>


<div id="banList"></div>


</div>

</section>




<section id="combos" class="hidden">

<div class="card">

<h1>
🔥 Комбо
</h1>


<div id="comboList"></div>


</div>

</section>



<section id="settings" class="hidden">

<div class="card">

<h1>
⚙ Настройки
</h1>


<p>
Настройки сайта будут тут
</p>


</div>

</section>




</main>

</div>
<script>


// ===============================
// SUPABASE
// ===============================


const SUPABASE_URL =
"https://lzbhpdievyemsioluvyc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_qvh9ZOOXqlEAsBexdJfdlA_UGu3jsCG";


const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);




// ===============================
// ВКЛАДКИ
// ===============================


function openTab(id){


document
.querySelectorAll("main section")
.forEach(x=>{

x.classList.add("hidden");

});


document
.getElementById(id)
.classList.remove("hidden");


}




// ===============================
// ТОВАРЫ
// ===============================



async function addProduct(){



let name =
document.getElementById("p_name").value.trim();



let category =
document.getElementById("p_category").value;



let price =
Number(
document.getElementById("p_price").value
);



let weight =
document.getElementById("p_weight").value;



let desc =
document.getElementById("p_desc").value;



if(!name || !category || !price){


alert(
"Заполни название, категорию и цену"
);


return;


}





let {error}=

await db

.from("menu_items")

.insert({

name:name,

category:category,

price:price,

weight:weight,

desc:desc


});




if(error){


alert(
"Ошибка: "+
error.message
);


return;


}



alert(
"✅ Товар добавлен"
);



clearProductForm();


loadProducts();



}





function clearProductForm(){


document.getElementById("p_name").value="";


document.getElementById("p_category").value="";


document.getElementById("p_price").value="";


document.getElementById("p_weight").value="";


document.getElementById("p_desc").value="";


}







async function loadProducts(){



let box =
document.getElementById("productList");



if(!box)
return;



box.innerHTML=
"Загрузка...";




let {data,error}=

await db

.from("menu_items")

.select("*")

.order(
"id",
{
ascending:false
}
);





if(error){


box.innerHTML=
"❌ "+error.message;


return;


}





if(!data.length){


box.innerHTML=
"Товаров нет";


return;


}





box.innerHTML = data.map(p=>`



<div class="product">


<h3>

${p.name}

</h3>


<b>

${p.category || "Без категории"}

</b>


<p>

💰 ${p.price} ₽

</p>


<p>

${p.weight || ""}

</p>


<p>

${p.desc || ""}

</p>



<button class="action"
onclick="editProduct(${p.id})">

✏ Изменить

</button>



<button class="action"
onclick="deleteProduct(${p.id})">

🗑 Удалить

</button>


</div>


`).join("");



}





async function deleteProduct(id){


if(!confirm(
"Удалить товар?"
))

return;



let {error}=

await db

.from("menu_items")

.delete()

.eq(
"id",
id
);




if(error){


alert(error.message);


return;


}



loadProducts();


}







async function editProduct(id){



let {data,error}=

await db

.from("menu_items")

.select("*")

.eq(
"id",
id
)

.single();





if(error){

alert(error.message);

return;

}




let name =
prompt(
"Название:",
data.name
);



if(name===null)
return;



let price =
prompt(
"Цена:",
data.price
);



let desc =
prompt(
"Описание:",
data.desc || ""
);





let result =

await db

.from("menu_items")

.update({

name:name,

price:Number(price),

desc:desc


})

.eq(
"id",
id
);





if(result.error){

alert(result.error.message);


}else{


loadProducts();


}



}






// ===============================
// АВТОЗАГРУЗКА
// ===============================



loadProducts();


</script>
<script>


// =================================
// ⭐ ОТЗЫВЫ
// =================================


async function loadReviews(){


let box =
document.getElementById("reviewList");


if(!box)
return;



box.innerHTML="Загрузка...";



let {data,error}=

await db

.from("reviews")

.select("*")

.order(
"created_at",
{
ascending:false
}
);




if(error){

box.innerHTML=
"❌ "+error.message;

return;

}



if(!data.length){

box.innerHTML=
"Отзывов пока нет";

return;

}



box.innerHTML=

data.map(r=>`


<div class="product">


<h3>
⭐ ${r.author || "Гость"}
</h3>


<p>
${r.text || ""}
</p>


<div class="small">

${r.created_at || ""}

</div>



<button class="action"
onclick="deleteReview('${r.id}')">

🗑 Удалить

</button>



${r.user_id ? `

<button class="action"
onclick="banUser('${r.user_id}')">

🚫 Забанить

</button>

`:''}



</div>


`).join("");



}






async function deleteReview(id){



if(!confirm(
"Удалить отзыв?"
))

return;



let {error}=

await db

.from("reviews")

.delete()

.eq(
"id",
id
);



if(error){

alert(error.message);

return;

}



loadReviews();


}







// =================================
// 🚫 БАНЫ
// =================================



async function banUser(uid){



let reason =
prompt(
"Причина бана:"
);



if(!reason)
return;



let {error}=

await db

.from("banned_users")

.insert({

user_id:uid,

reason:reason

});




if(error){

alert(error.message);

return;

}



alert(
"Пользователь заблокирован"
);



loadBans();


}







async function loadBans(){



let box =
document.getElementById("banList");



if(!box)
return;



box.innerHTML="Загрузка...";




let {data,error}=

await db

.from("banned_users")

.select("*")

.order(
"created_at",
{
ascending:false
}
);




if(error){

box.innerHTML=
error.message;

return;

}




if(!data.length){

box.innerHTML=
"Банов нет";

return;

}





box.innerHTML=

data.map(b=>`


<div class="product">


<h3>
🚫 ${b.user_id}
</h3>


<p>
${b.reason || ""}
</p>



<button class="action"
onclick="unban('${b.id}')">

Разбанить

</button>


</div>


`).join("");



}




async function unban(id){



await db

.from("banned_users")

.delete()

.eq(
"id",
id
);



loadBans();


}







// =================================
// 🔥 КОМБО
// =================================




async function loadCombos(){


let box =
document.getElementById("comboList");



if(!box)
return;



box.innerHTML="Загрузка...";



let {data,error}=

await db

.from("combos")

.select("*")

.order("id");




if(error){

box.innerHTML=
error.message;

return;

}




box.innerHTML=`

<button class="action"
onclick="createCombo()">

➕ Создать комбо

</button>

`;


data.forEach(c=>{


box.innerHTML+=`

<div class="product">


<h3>
🔥 ${c.name}
</h3>


<p>
${c.description}
</p>


<b>
${c.price} ₽
</b>


<button class="action"
onclick="deleteCombo(${c.id})">

🗑

</button>


</div>

`;

});


}






async function createCombo(){



let name =
prompt(
"Название комбо:"
);



let desc =
prompt(
"Состав:"
);



let price =
Number(
prompt(
"Цена:"
)
);




if(!name || !price)
return;



let {error}=

await db

.from("combos")

.insert({

name:name,

description:desc,

price:price

});




if(error){

alert(error.message);

return;

}



loadCombos();


}




async function deleteCombo(id){



await db

.from("combos")

.delete()

.eq(
"id",
id
);



loadCombos();


}






// =================================
// 📊 ОБНОВЛЕНИЕ ПРИ ОТКРЫТИИ
// =================================



document.addEventListener(
"DOMContentLoaded",
()=>{


loadProducts();

loadReviews();

loadBans();

loadCombos();


});


</script>
