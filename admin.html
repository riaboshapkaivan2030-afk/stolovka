<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Столовка — Админка</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f3ed;font-family:Arial;color:#18201d;padding:25px}
.box{max-width:1200px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 15px 40px #0002}
input,textarea,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ddd}
button{background:#d85a36;color:#fff;border:0;cursor:pointer;font-weight:bold}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
td input,td textarea{width:100%}
.status{margin-top:10px;color:#666}
</style>
</head>

<body>

<div class="box" id="loginBox">
<h2>🔐 Админ вход</h2>
<input id="email" type="email" placeholder="Email">
<br><br>
<input id="password" type="password" placeholder="Пароль">
<br><br>
<button id="loginBtn">Войти</button>
<div class="status" id="loginStatus"></div>
</div>


<div class="box hidden" id="adminBox">
<h2>🍽 Редактор меню</h2>

<button id="saveBtn">💾 Сохранить</button>
<button id="logoutBtn">Выйти</button>

<div class="status" id="status"></div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Название</th>
<th>Цена ₽</th>
<th>Категория</th>
<th>Описание</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

</div>


<script>

const SUPABASE_URL="https://lzbhpdievyemsioluvyc.supabase.co";

const SUPABASE_ANON_KEY="ВСТАВЬ_СЮДА_ANON_KEY";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


const $=x=>document.querySelector(x);


async function checkAdmin(){

const {data:{session}}=
await supabaseClient.auth.getSession();

if(!session)return false;


const {data,error}=await supabaseClient
.from("admin_users")
.select("*")
.eq("user_id",session.user.id)
.single();


return !error&&data;

}


async function login(){

$("#loginStatus").textContent="Проверка...";

const {error}=await supabaseClient.auth.signInWithPassword({

email:$("#email").value.trim(),

password:$("#password").value

});


if(error){

$("#loginStatus").textContent=error.message;
return;

}


if(await checkAdmin()){

openAdmin();

}else{

await supabaseClient.auth.signOut();

$("#loginStatus").textContent="Нет доступа";

}

}



function openAdmin(){

$("#loginBox").classList.add("hidden");

$("#adminBox").classList.remove("hidden");

loadMenu();

}



async function loadMenu(){

$("#status").textContent="Загрузка...";


const {data,error}=await supabaseClient
.from("menu_items")
.select("*")
.order("id");


if(error){

$("#status").textContent=error.message;
return;

}


$("#rows").innerHTML=data.map(x=>`

<tr data-id="${x.id}">
<td>${x.id}</td>
<td><input data-name value="${x.name||""}"></td>
<td><input data-price type="number" value="${x.price||0}"></td>
<td>${x.category||""}</td>
<td><textarea data-desc>${x.desc||""}</textarea></td>
</tr>

`).join("");


$("#status").textContent="Загружено: "+data.length;

}



async function save(){

let rows=document.querySelectorAll("#rows tr");

let updates=[];


rows.forEach(row=>{

updates.push({

id:Number(row.dataset.id),

name:row.querySelector("[data-name]").value,

price:Number(row.querySelector("[data-price]").value),

desc:row.querySelector("[data-desc]").value,

updated_at:new Date().toISOString()

});

});


const {error}=await supabaseClient
.from("menu_items")
.upsert(updates,{onConflict:"id"});


$("#status").textContent=
error?error.message:"✅ Сохранено";

}



$("#loginBtn").onclick=login;

$("#saveBtn").onclick=save;


$("#logoutBtn").onclick=async()=>{

await supabaseClient.auth.signOut();

location.reload();

};


checkAdmin().then(ok=>{

if(ok)openAdmin();

});

</script>

</body>
</html>
