<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Админка столовой</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
background:#111;
font-family:Arial;
color:white;
padding:30px;
}

.card{
max-width:900px;
margin:auto;
background:#1e1e1e;
padding:30px;
border-radius:20px;
}

input,textarea{
width:100%;
padding:12px;
margin:8px 0;
background:#303747;
color:white;
border:1px solid #555;
border-radius:10px;
}

button{
width:100%;
padding:14px;
background:#ff5722;
color:white;
border:0;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.8;
}

.hide{
display:none;
}

.status{
padding:12px;
margin-top:15px;
border-radius:10px;
background:#333;
}

.error{
background:#8b1e1e;
}

.good{
background:#087f23;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
padding:10px;
border-bottom:1px solid #444;
}

</style>

</head>


<body>


<div class="card" id="login">

<h1>🔐 Админ вход</h1>


<input id="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Пароль">


<button onclick="login()">
Войти
</button>


<div id="info" class="status">
Ожидание...
</div>


</div>





<div class="card hide" id="panel">


<h1>🍽 Админка</h1>

<button onclick="logout()">
Выйти
</button>


<div id="status" class="status"></div>


<h2>Меню</h2>


<table>

<thead>
<tr>
<th>ID</th>
<th>Название</th>
<th>Цена</th>
</tr>
</thead>


<tbody id="items"></tbody>


</table>


</div>



<script>


const URL =
"https://lzbhpdievyemsioluvyc.supabase.co";


const KEY =
"ТВОЙ_SB_PUBLISHABLE_KEY";


const supabase =
window.supabase.createClient(
URL,
KEY
);



function text(id,msg,type=""){

let e=document.getElementById(id);

e.innerHTML=msg;

e.className="status "+type;

}




async function login(){


text(
"info",
"⏳ Вход..."
);



let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



let {data,error}=await supabase.auth.signInWithPassword({

email,
password

});



if(error){

text(
"info",
"❌ "+error.message,
"error"
);

return;

}



let uid=data.user.id;


text(
"info",
"Проверяем UID: "+uid
);



let admin =
await supabase
.from("admin_users")
.select("*")
.eq("user_id",uid);



console.log(admin);



if(admin.error){

text(
"info",
"❌ "+admin.error.message,
"error"
);

return;

}



if(admin.data.length===0){

text(
"info",
"❌ UID нет в admin_users",
"error"
);

return;

}



document
.getElementById("login")
.classList.add("hide");


document
.getElementById("panel")
.classList.remove("hide");


loadMenu();


}





async function loadMenu(){


text(
"status",
"Загрузка..."
);



let {data,error}=await supabase
.from("menu_items")
.select("*")
.order("id");



if(error){

text(
"status",
error.message,
"error"
);

return;

}



document
.getElementById("items")
.innerHTML =
data.map(x=>`

<tr>

<td>${x.id}</td>

<td>${x.name}</td>

<td>${x.price} ₽</td>

</tr>

`).join("");



text(
"status",
"✅ Загружено "+data.length,
"good"
);


}




async function logout(){

await supabase.auth.signOut();

location.reload();

}


</script>


</body>
</html>
