<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Столовка — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    margin:0;
    background:#0f1117;
    color:white;

}


/* LOGIN */

#loginPage{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}



.login-box{

    width:380px;
    background:#191f2b;
    padding:30px;
    border-radius:25px;
    box-shadow:0 20px 50px #000;

}


h1,h2,h3{

    margin-top:0;

}



input,
textarea,
select{


    width:100%;
    padding:13px;

    margin:8px 0;

    border-radius:12px;

    border:1px solid #394354;

    background:#252d3b;

    color:white;

    font-size:15px;

}



textarea{

    min-height:100px;

}




button{


    padding:13px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-weight:bold;

}




.login-btn,
.save-btn{


    width:100%;

    background:#ff5722;

    color:white;

}



.error{


    background:#9b2c2c;

    padding:10px;

    margin-top:10px;

    border-radius:10px;

}



/* ADMIN */


.hidden{

display:none!important;

}



.layout{

display:flex;

min-height:100vh;

}



.sidebar{


width:260px;

background:#171d28;

padding:20px;

position:fixed;

height:100vh;


}



.logo{


font-size:26px;

font-weight:bold;

margin-bottom:35px;


}




.menu button{


width:100%;

background:#232c3b;

color:white;

margin-bottom:10px;

text-align:left;


}



.menu button:hover{

background:#ff5722;

}




.content{


margin-left:260px;

padding:30px;

width:100%;


}





.card{


background:#191f2b;

padding:25px;

border-radius:22px;

margin-bottom:20px;

box-shadow:0 10px 30px #0005;


}





.grid{


display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;


}



.stat{


font-size:40px;

font-weight:bold;


}





.red{


background:#c62828;

color:white;


}


.green{


background:#2e7d32;

color:white;


}


.orange{


background:#ff5722;

color:white;


}




.product{


background:#222b38;

padding:20px;

border-radius:15px;

margin-top:15px;


}




@media(max-width:800px){


.sidebar{

position:relative;

width:100%;

height:auto;

}


.content{

margin-left:0;

}


.layout{

display:block;

}



}


</style>

</head>


<body>



<!-- ВХОД -->


<div id="loginPage">


<div class="login-box">


<h1>
🔐 Вход
</h1>



<input id="email"
type="email"
placeholder="Email">



<input id="password"
type="password"
placeholder="Пароль">



<button class="login-btn"
onclick="login()">

Войти

</button>



<div id="loginError"></div>


</div>


</div>





<!-- АДМИНКА -->


<div id="adminPage"
class="hidden">



<div class="layout">



<aside class="sidebar">


<div class="logo">

🍽 Столовка

</div>



<div class="menu">


<button onclick="openTab('home')">

🏠 Главная

</button>



<button onclick="openTab('products')">

🍔 Блюда

</button>



<button onclick="openTab('reviews')">

⭐ Отзывы

</button>



<button onclick="openTab('combos')">

🔥 Комбо

</button>



<button onclick="openTab('bans')">

🚫 Баны

</button>



<button onclick="logout()">

🚪 Выйти

</button>



</div>


</aside>





<main class="content">



<section id="home">


<h1>
🏠 Главная
</h1>



<div class="grid">



<div class="card">

<h3>
🍽 Блюда
</h3>

<div class="stat" id="countProducts">
0
</div>


</div>





<div class="card">

<h3>
⭐ Отзывы
</h3>

<div class="stat" id="countReviews">
0
</div>


</div>





<div class="card">

<h3>
🔥 Комбо
</h3>

<div class="stat" id="countCombos">
0
</div>


</div>



</div>



</section>





<section id="products"
class="hidden">



<div class="card">


<h1>
🍔 Добавить блюдо
</h1>



<input id="productName"
placeholder="Название">



<select id="productCategory">

<option>
🍲 Первые блюда
</option>

<option>
🍗 Вторые блюда
</option>

<option>
🥗 Салаты
</option>

<option>
🥤 Напитки
</option>

<option>
🍰 Десерты
</option>


</select>



<input id="productPrice"
type="number"
placeholder="Цена ₽">



<input id="productWeight"
placeholder="Вес">



<h3>
🔥 КБЖУ
</h3>



<input id="productCalories"
placeholder="Калории">


<input id="productProtein"
placeholder="Белки">


<input id="productFat"
placeholder="Жиры">


<input id="productCarbs"
placeholder="Углеводы">



<input id="productStock"
type="number"
placeholder="Количество">



<textarea id="productDesc"
placeholder="Описание"></textarea>



<button class="save-btn"
onclick="addProduct()">

💾 Сохранить

</button>



</div>





<div class="card">


<h1>
Список блюд
</h1>


<input id="searchProduct"
placeholder="🔎 Поиск">



<div id="productList">

</div>


</div>



</section>
<!-- ОТЗЫВЫ -->

<section id="reviews" class="hidden">

<div class="card">

<h1>
⭐ Отзывы
</h1>


<button class="orange"
onclick="loadReviews()">

Обновить отзывы

</button>


<div id="reviewList">

</div>


</div>

</section>






<!-- КОМБО -->

<section id="combos" class="hidden">


<div class="card">

<h1>
🔥 Комбо
</h1>


<p>
Скоро добавим конструктор:
</p>


<p>
🍝 Макароны + 🍗 Котлета + 🥤 Компот
</p>


</div>


</section>






<!-- БАНЫ -->

<section id="bans" class="hidden">


<div class="card">


<h1>
🚫 Блокировки
</h1>


<div id="banList">

Пока пусто

</div>


</div>


</section>






</main>

</div>

</div>






<script>


// ============================
// SUPABASE
// ============================


const SUPABASE_URL =
"https://lzbhpdievyemsioluvyc.supabase.co";


const SUPABASE_KEY =
"sb_publishable_qvh9ZOOXqlEAsBexdJfdlA_UGu3jsCG";



const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





let products=[];





// ============================
// ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ============================


function openTab(id){


document
.querySelectorAll(".content section")
.forEach(section=>{

section.classList.add("hidden");

});


document
.getElementById(id)
.classList.remove("hidden");


}







// ============================
// ВХОД
// ============================


async function login(){


console.log("login работает");



let email =
document.getElementById("email").value.trim();


let password =
document.getElementById("password").value;



let errorBox =
document.getElementById("loginError");



errorBox.innerHTML="";



const {data,error}=

await db.auth.signInWithPassword({

email,
password

});




if(error){


errorBox.innerHTML=

`
<div class="error">

${error.message}

</div>
`;


return;


}





let user=data.user;



const {data:admin,error:adminError}=

await db

.from("admin_users")

.select("*")

.eq(
"user_id",
user.id
)

.single();






if(adminError || !admin){



await db.auth.signOut();



errorBox.innerHTML=

`
<div class="error">

Нет прав администратора

<br>

${adminError?.message || ""}

</div>
`;



return;


}






document
.getElementById("loginPage")
.classList.add("hidden");



document
.getElementById("adminPage")
.classList.remove("hidden");




loadProducts();


loadReviews();



}









// ============================
// ПРОВЕРКА СЕССИИ
// ============================


async function checkSession(){


const {data}=

await db.auth.getSession();



if(!data.session)
return;




const check=

await db

.from("admin_users")

.select("*")

.eq(
"user_id",
data.session.user.id
)

.single();





if(!check.error){


document
.getElementById("loginPage")
.classList.add("hidden");



document
.getElementById("adminPage")
.classList.remove("hidden");



loadProducts();


loadReviews();


}


}








// ============================
// ДОБАВЛЕНИЕ ТОВАРА
// ============================


async function addProduct(){



let item={



name:

document.getElementById("productName").value,



category:

document.getElementById("productCategory").value,



price:

Number(
document.getElementById("productPrice").value
),



weight:

document.getElementById("productWeight").value,



calories:

Number(
document.getElementById("productCalories").value || 0
),



proteins:

Number(
document.getElementById("productProtein").value || 0
),



fats:

Number(
document.getElementById("productFat").value || 0
),



carbs:

Number(
document.getElementById("productCarbs").value || 0
),



stock:

Number(
document.getElementById("productStock").value || 0
),



desc:

document.getElementById("productDesc").value,



is_available:true


};






if(!item.name){


alert(
"Введите название"
);

return;

}







const {error}=

await db

.from("menu_items")

.insert(item);







if(error){


alert(
error.message
);

return;


}





alert(
"✅ Блюдо добавлено"
);



loadProducts();


}







// ============================
// ЗАГРУЗКА ТОВАРОВ
// ============================


async function loadProducts(){



let box =
document.getElementById("productList");



box.innerHTML="Загрузка...";





const {data,error}=

await db

.from("menu_items")

.select("*")

.order(
"id",
{
ascending:false
}
);





if(error){


box.innerHTML=
error.message;


return;


}




products=data;



document
.getElementById("countProducts")
.innerText=data.length;




renderProducts(data);



}





function renderProducts(list){



let box =
document.getElementById("productList");



box.innerHTML=

list.map(p=>`


<div class="product">


<h2>
${p.name}
</h2>


<p>
${p.category}
</p>


<h2>
💰 ${p.price} ₽
</h2>


<p>
⚖ ${p.weight || "-"}
</p>


<p>
🔥 ${p.calories || 0} ккал
</p>


<p>
🥩 ${p.proteins || 0}
🧈 ${p.fats || 0}
🍞 ${p.carbs || 0}
</p>


<p>
📦 ${p.stock || 0} шт.
</p>



<button class="red"
onclick="deleteProduct(${p.id})">

🗑 Удалить

</button>



</div>


`).join("");



}






async function deleteProduct(id){


if(!confirm(
"Удалить?"
))
return;




const {error}=

await db

.from("menu_items")

.delete()

.eq(
"id",
id
);





if(error){

alert(error.message);

return;

}



loadProducts();


}






document
.getElementById("searchProduct")
.addEventListener(
"input",
function(){

let text=this.value.toLowerCase();


renderProducts(

products.filter(p=>

p.name
.toLowerCase()
.includes(text)

)

);


});



// ============================
// ОТЗЫВЫ
// ============================


async function loadReviews(){


let box =
document.getElementById("reviewList");


box.innerHTML="Загрузка...";



const {data,error}=

await db

.from("reviews")

.select("*")

.order(
"created_at",
{
ascending:false
}
);





if(error){


box.innerHTML=
error.message;


return;


}





document
.getElementById("countReviews")
.innerText =
data.length;



if(!data.length){


box.innerHTML="Отзывов нет";


return;


}





box.innerHTML =

data.map(r=>`


<div class="product">


<h3>

${r.author || r.user_name || "Гость"}

</h3>


<p>

${r.text || r.comment || ""}

</p>


<small>

${r.created_at || ""}

</small>



<br><br>


<button class="red"

onclick="deleteReview('${r.id}')">

🗑 Удалить

</button>


</div>


`).join("");



}





async function deleteReview(id){


if(!confirm(
"Удалить отзыв?"
))
return;




const {error}=

await db

.from("reviews")

.delete()

.eq(
"id",
id
);





if(error){

alert(error.message);

return;

}



loadReviews();


}








// ============================
// ВЫХОД
// ============================


async function logout(){


await db.auth.signOut();


location.reload();


}







// ============================
// ЗАПУСК
// ============================


checkSession();



</script>


</body>

</html>
